<svg xmlns="http://www.w3.org/2000/svg" width="2170" height="725" viewBox="0 0 2170 725" role="img" aria-labelledby="title desc">
<title id="title">Jarvis Voice</title>
<desc id="desc">Banner azul-escuro do Jarvis Voice com ícone de microfone à esquerda, Wake-on-LAN e SSH ao centro e ícones de computador e terminal à direita. Todos os elementos dentro da borda.</desc>
