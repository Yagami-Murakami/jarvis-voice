<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790" role="img" aria-labelledby="title description">
<title id="title">Como funciona o Jarvis Voice</title>
<desc id="description">Fluxograma sem sobreposições: Microfone USB, ALSA e arecord, Vosk, Jarvis Voice, Wake-on-LAN para ligar computadores e SSH para desligá-los após confirmação.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e5f2ff"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#063257"/><stop offset="1" stop-color="#005e93"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#17436c" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1e567e"/></marker>
</defs>
<rect width="1800" height="790" rx="30" fill="url(#bg)"/>
<path d="M0 115C180 30 225 85 334 0H0Z" fill="#cdeaff" opacity=".75"/>
<path d="M1800 672C1630 700 1580 760 1460 790H1800Z" fill="#cceaff" opacity=".8"/>
<g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
  <text x="900" y="91" font-size="60" font-weight="800" fill="#0a294b">Como funciona o <tspan fill="#007bf1">Jarvis Voice</tspan></text>
  <text x="900" y="144" font-size="25" fill="#516b87">Comandos de voz processados localmente • Liga por WoL • Desliga com confirmação por SSH</text>
</g>

<!-- Cards are separated by open gutters reserved for arrows -->
<g filter="url(#shadow)">
  <rect x="45" y="225" width="202" height="319" rx="25" fill="#fff" stroke="#c6def1" stroke-width="3"/>
  <rect x="290" y="225" width="202" height="319" rx="25" fill="#fff" stroke="#c6def1" stroke-width="3"/>
  <rect x="535" y="225" width="202" height="319" rx="25" fill="#fff" stroke="#c6def1" stroke-width="3"/>
  <rect x="780" y="217" width="240" height="335" rx="28" fill="url(#core)" stroke="#02c7fd" stroke-width="5"/>
  <rect x="1158" y="236" width="265" height="127" rx="22" fill="#e8f5ff" stroke="#63bbff" stroke-width="3"/>
  <rect x="1158" y="412" width="265" height="127" rx="22" fill="#f1eafe" stroke="#b79afa" stroke-width="3"/>
  <rect x="1475" y="236" width="275" height="127" rx="22" fill="#defbe9" stroke="#57d99c" stroke-width="3"/>
  <rect x="1475" y="412" width="275" height="127" rx="22" fill="#ffebee" stroke="#fa99ab" stroke-width="3"/>
</g>

<!-- Arrows live strictly in gutters, clear of text and icons -->
<g stroke="#1e567e" stroke-width="6" fill="none" marker-end="url(#arrow)">
 <path d="M251 386H283"/>
 <path d="M496 386H528"/>
 <path d="M741 386H773"/>
 <path d="M1024 386H1090V299H1149"/>
 <path d="M1090 386V475H1149"/>
 <path d="M1427 299H1466"/>
 <path d="M1427 475H1466"/>
</g>

<!-- Microphone -->
<g transform="translate(146 337)" stroke="#1e648f" stroke-width="9" fill="none" stroke-linecap="round">
 <rect x="-25" y="-72" width="50" height="95" rx="25" fill="#d5eeff"/>
 <path d="M-53 -6V24C-53 66 -29 86 0 86S53 66 53 24V-6M0 86V112M-35 112H35"/>
</g>

<!-- ALSA terminal -->
<g transform="translate(391 337)">
 <rect x="-71" y="-60" width="142" height="117" rx="14" fill="#092f54"/>
 <g stroke-linecap="round" fill="none"><path d="M-41 -32L-16 -10L-41 11M-4 13H14" stroke="#fff" stroke-width="8"/>
 <path d="M-37 41V31M-20 41V20M-3 41V27M14 41V8M31 41V20M48 41V1" stroke="#20e9e1" stroke-width="6"/></g>
</g>

<!-- Vosk audio icon -->
<g transform="translate(636 333)">
 <rect x="-66" y="-60" width="132" height="120" rx="26" fill="#147fe3"/>
 <path d="M-42 -5V16M-23 -24V34M0 -38V45M23 -24V34M42 -5V16" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
</g>

<!-- Jarvis core: intentionally fully inside card -->
<g transform="translate(900 331)">
 <circle r="92" fill="#063963" stroke="#36dff5" stroke-width="6"/>
 <circle r="69" fill="none" stroke="#92ebff" stroke-width="4" opacity=".8"/>
 <path d="M-20 -40C-61 -36 -66 25 -28 48M21 -40C62 -30 65 27 27 50M-20 -40C-12 -68 16 -65 21 -40M-28 48C-15 66 19 67 27 50" stroke="#83edfb" stroke-width="7" fill="none" stroke-linecap="round"/>
 <path d="M0 -45V0L-24 26M0 0L24 25M0 0V51" stroke="#bcfaff" stroke-width="5" fill="none"/>
 <g fill="#28e5f0"><circle cx="-24" cy="26" r="7"/><circle cx="24" cy="25" r="7"/><circle cx="0" cy="51" r="7"/></g>
</g>
<!-- Visual icons inside right-hand cards -->
<g transform="translate(1216 299)" stroke="#006cc5" fill="none" stroke-width="7" stroke-linecap="round">
 <path d="M-33 -18Q0 -48 33 -18M-23 -7Q0 -27 23 -7M-12 5Q0 -3 12 5"/><circle cx="0" cy="19" r="5" fill="#006cc5" stroke="none"/>
</g>
<g transform="translate(1216 475)" fill="none" stroke="#41348d" stroke-width="5" stroke-linecap="round">
 <rect x="-35" y="-33" width="70" height="65" rx="7"/>
 <path d="M-16 -9L1 3L-16 15M8 15H24"/>
</g>
<g transform="translate(1533 299)" fill="none" stroke="#128d4a" stroke-width="6" stroke-linecap="round">
 <rect x="-32" y="-25" width="64" height="49" rx="5"/>
 <path d="M0-15V3M-13 -4A20 20 0 1 0 13 -4M0 24V35M-24 35H24"/>
</g>
<g transform="translate(1533 475)" fill="none" stroke="#c23855" stroke-width="6" stroke-linecap="round">
 <rect x="-32" y="-25" width="64" height="49" rx="5"/>
 <path d="M0-15V3M-13 -4A20 20 0 1 0 13 -4M0 24V35M-24 35H24"/>
</g>

<!-- Labels are centered within their own cards -->
<g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
  <text x="146" y="488" font-size="22" font-weight="700" fill="#103353">Microfone USB</text>
  <text x="391" y="488" font-size="22" font-weight="700" fill="#103353">ALSA / arecord</text>
  <text x="636" y="476" font-size="27" font-weight="700" fill="#103353">Vosk</text>
  <text x="636" y="509" font-size="17" fill="#5a7488">Fala para texto</text>
  <text x="900" y="507" font-size="29" font-weight="800" fill="#fff">Jarvis Voice</text>

  <text x="1328" y="292" font-size="26" font-weight="800" fill="#14518f">Wake-on-LAN</text>
  <text x="1328" y="325" font-size="18" fill="#386789">Pacote mágico</text>
  <text x="1328" y="470" font-size="30" font-weight="800" fill="#403687">SSH</text>
  <text x="1328" y="501" font-size="18" fill="#655c91">Comando remoto</text>

  <text x="1642" y="292" font-size="26" font-weight="800" fill="#147948">Ligar PCs</text>
  <text x="1642" y="325" font-size="17" fill="#49775b">Energia</text>
  <text x="1642" y="470" font-size="25" font-weight="800" fill="#b02e4c">Desligar PCs</text>
  <text x="1642" y="501" font-size="16" fill="#965665">Após confirmação</text>
</g>

<!-- Footer deliberately separated from cards and arrows -->
<rect x="250" y="630" width="1300" height="105" rx="43" fill="#103961"/>
<rect x="250" y="630" width="1300" height="105" rx="43" stroke="#00caed" stroke-width="4" fill="none"/>
<g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
 <text x="900" y="674" font-size="26" font-weight="800" fill="#fff">Palavra de ativação: “Assistente”</text>
 <text x="900" y="713" font-size="20" fill="#a8ebff">Desligamento exige confirmação explícita e pode ser simulado</text>
</g>
</svg>